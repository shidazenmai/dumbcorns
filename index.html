<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Logos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 150vh;
            margin: 0;
            background-color: #FFCC99;
            padding: 20px;
            text-align: center;
        }

        .logo-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }

        .logo-container a {
            display: inline-block;
            width: 120px;
            height: 120px;
            transition: transform 0.3s ease;
        }

        .logo-container a img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            border-radius: 8px;
        }

        .logo-container a:hover {
            transform: scale(1.1);
        }

        h1 {
            margin-bottom: 20px;
        }

        @media screen and (max-width: 768px) {
            .logo-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="logo-container">
